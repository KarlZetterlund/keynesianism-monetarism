er geografiska placering motsvarar inte arbetsmarknadens behov.", "g": "Gemensamma"}, {"t": "Friktionsarbetslöshet", "d": "Tillfällig arbetslöshet när människor söker sitt första jobb eller byter arbete.", "g": "Gemensamma"}, {"t": "Konjunkturarbetslöshet", "d": "Svag efterfrågan under lågkonjunktur gör att företag behöver färre anställda.", "g": "Gemensamma"}, {"t": "Stabiliseringspolitik", "d": "Politik som jämnar ut konjunktursvängningar och motverkar hög inflation och arbetslöshet.", "g": "Gemensamma"}, {"t": "Centralbank", "d": "Institution som ansvarar för penningpolitiken och arbetar för prisstabilitet. I Sverige Riksbanken.", "g": "Gemensamma"}, {"t": "Keynesianism", "d": "Teori som förespråkar aktiv statlig finanspolitik för att påverka efterfrågan, jämna ut konjunkturer och bekämpa arbetslöshet.", "g": "Keynesianism"}, {"t": "John Maynard Keynes", "d": "Brittisk ekonom som utvecklade keynesianismen och förespråkade statliga efterfrågestimulanser vid kriser.", "g": "Keynesianism"}, {"t": "Den stora depressionen", "d": "Internationell ekonomisk kris från 1929 med massarbetslöshet, som bidrog till keynesianismens framväxt.", "g": "Keynesianism"}, {"t": "The New Deal", "d": "Roosevelts reformprogram på 1930-talet med bland annat offentliga investeringar för att bekämpa arbetslöshet i USA.", "g": "Keynesianism"}, {"t": "Finanspolitik", "d": "Staten påverkar ekonomin genom skatter, bidrag och offentliga utgifter.", "g": "Keynesianism"}, {"t": "Expansiv finanspolitik", "d": "Sänkta skatter, höjda bidrag eller ökade offentliga investeringar stimulerar efterfrågan och sysselsättningen.", "g": "Keynesianism"}, {"t": "Restriktiv finanspolitik", "d": "Höjda skatter, sänkta bidrag eller minskade offentliga investeringar dämpar efterfrågan och inflationen.", "g": "Keynesianism"}, {"t": "Offentliga investeringar", "d": "Stat, regioner eller kommuner satsar på exempelvis vägar, järnvägar och skolor, vilket kan skapa jobb och efterfrågan.", "g": "Keynesianism"}, {"t": "Multiplikatoreffekten", "d": "En satsning skapar inkomster och konsumtion i flera led, så att den totala effekten blir större än den ursprungliga satsningen.", "g": "Keynesianism"}, {"t": "Kontracyklisk stabiliseringspolitik", "d": "Att stimulera ekonomin i lågkonjunktur och dämpa den i högkonjunktur.", "g": "Keynesianism"}, {"t": "Phillipskurvan", "d": "Modell över ett kortsiktigt omvänt samband mellan inflation och arbetslöshet.", "g": "Keynesianism"}, {"t": "Monetarism", "d": "Teori som betonar kontroll av penningmängden, låg och stabil inflation, fria marknader och begränsad statlig inblandning.", "g": "Monetarism"}, {"t": "Milton Friedman", "d": "Amerikansk ekonom som betonade penningmängdens betydelse och kritiserade aktiv finanspolitik.", "g": "Monetarism"}, {"t": "Oljekrisen på 1970-talet", "d": "Stigande oljepriser bidrog till hög inflation och arbetslöshet samtidigt, vilket stärkte monetarismens genomslag.", "g": "Monetarism"}, {"t": "Penningpolitik", "d": "Centralbanken påverkar ekonomin genom bland annat styrräntan för att påverka efterfrågan och inflation.", "g": "Monetarism"}, {"t": "Expansiv penningpolitik", "d": "Centralbanken exempelvis sänker styrräntan för att stimulera konsumtion, investeringar och sysselsättning.", "g": "Monetarism"}, {"t": "Restriktiv penningpolitik", "d": "Centralbanken exempelvis höjer styrräntan för att dämpa efterfrågan och inflation.", "g": "Monetarism"}, {"t": "Styrränta", "d": "Ränta som centralbanken bestämmer för att påverka andra räntor, efterfrågan och inflation.", "g": "Monetarism"}, {"t": "Marknadsränta", "d": "Ränta som bestäms av banker på exempelvis bolån och privatlån – påverkas av bland annat styrräntan, utbud och efterfrågan.", "g": "Monetarism"}, {"t": "Penningmängd", "d": "Totala mängden pengar i ekonomin, inklusive kontanter och olika former av bankinlåning.", "g": "Monetarism"}, {"t": "Stagflation", "d": "Hög inflation, hög arbetslöshet och svag ekonomisk tillväxt samtidigt.", "g": "Monetarism"}, {"t": "NAIRU (jämviktsarbetslöshet/naturlig arbetslöshet)", "d": "Arbetslöshetsnivån förenlig med en inflation som inte accelererar, främst förknippad med struktur- och friktionsarbetslöshet.", "g": "Monetarism"}, {"t": "Den vertikala Phillipskurvan", "d": "Modell som visar att arbetslösheten långsiktigt inte kan hållas under jämviktsnivån genom ökad efterfrågan utan accelererande inflation.", "g": "Monetarism"}, {"t": "Marknadsliberalism", "d": "Synsätt som förespråkar fria marknader, konkurrens och begränsad statlig inblandning.", "g": "Monetarism"}, {"t": "Avreglering", "d": "Att minska regleringar för att exempelvis öka konkurrens och effektivisera marknaden.", "g": "Monetarism"}, {"t": "Arbetsmarknadspolitik", "d": "Åtgärder för att öka sysselsättningen, minska arbetslösheten och förbättra arbetsmarknadens funktion.", "g": "Monetarism"}, {"t": "Selektiva åtgärder", "d": "Riktade insatser som utbildning och arbetsförmedling för att minska struktur- och friktionsarbetslöshet.", "g": "Monetarism"}, {"t": "Matchning på arbetsmarknaden", "d": "Att sammanföra arbetssökande med arbetsgivare som behöver deras kompetens.", "g": "Monetarism"}], theory=[{"q": "Teorin utvecklades av den brittiske ekonomen John Maynard Keynes.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Keynes utvecklade teorin för att förklara hur svag efterfrågan kan skapa långvarig arbetslöshet. Staten kan därför behöva stimulera ekonomin."}, {"q": "Teorin växte fram i samband med den stora depressionen på 1930-talet.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Under depressionen räckte efterfrågan inte till för att hålla människor i arbete. Keynes betonade att staten kunde bryta nedgången genom att öka efterfrågan."}, {"q": "Teorin förknippas med de ekonomiska reformerna inom The New Deal i USA.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. New Deal omfattade bland annat offentliga projekt som skapade arbetstillfällen. Sådana satsningar ligger nära keynesianismens syn på aktiv finanspolitik."}, {"q": "Staten bör ha en aktiv roll i att stabilisera samhällsekonomin.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. När privat efterfrågan sviktar kan staten öka sina utgifter, och vid överhettning kan den bromsa efterfrågan. Detta är kärnan i aktiv stabiliseringspolitik."}, {"q": "Finanspolitiken är det främsta verktyget för att stabilisera konjunkturerna.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Genom att ändra skatter och offentliga utgifter kan staten påverka hushållens köpkraft och den samlade efterfrågan."}, {"q": "Hög arbetslöshet förklaras framför allt av otillräcklig efterfrågan under en lågkonjunktur.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. När hushåll och företag köper mindre får företagen färre beställningar. De kan då minska produktionen och säga upp personal."}, {"q": "Bekämpning av arbetslöshet prioriteras framför en strikt inflationsbekämpning.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Keynesianismen betonar att arbetslöshet till följd av svag efterfrågan kan bekämpas med stimulanser, även om inflationen kan öka något."}, {"q": "Staten bör bedriva expansiv finanspolitik under en lågkonjunktur.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Ökade offentliga utgifter eller sänkta skatter kan öka efterfrågan. Företagen kan då öka produktionen och anställa fler."}, {"q": "Staten bör bedriva restriktiv finanspolitik under en högkonjunktur.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Höjda skatter eller minskade offentliga utgifter dämpar efterfrågan. Det kan motverka överhettning och inflation."}, {"q": "Staten bör acceptera budgetunderskott under lågkonjunkturer för att stimulera ekonomin.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. När efterfrågan är svag kan staten tillfälligt låna för att finansiera stimulanser. Syftet är att minska konjunkturarbetslösheten."}, {"q": "Staten bör eftersträva budgetöverskott under högkonjunkturer för att skapa utrymme inför framtida lågkonjunkturer.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Under högkonjunkturen kan staten spara när skatteintäkterna är höga. Det skapar ekonomiskt utrymme att stimulera nästa lågkonjunktur."}, {"q": "Multiplikatoreffekten är central för att förklara hur statliga investeringar påverkar ekonomin.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. En offentlig investering skapar inkomster som delvis används till konsumtion. Därmed kan efterfrågan och produktionen öka även i andra branscher."}, {"q": "Statliga investeringar kan skapa arbetstillfällen och därigenom öka konsumtionen i flera led.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. De som får arbete genom investeringen får lön och kan konsumera mer. Det skapar nya inkomster i andra delar av ekonomin genom multiplikatoreffekten."}, {"q": "Staten bör bedriva en aktiv kontracyklisk finanspolitik.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Kontracyklisk betyder att politiken går emot konjunkturen: stimulera vid lågkonjunktur och bromsa vid högkonjunktur."}, {"q": "Efter finanskrisen 2008 genomförde Barack Obamas regering ett stort ekonomiskt stimulanspaket som bland annat innehöll offentliga investeringar i vägar och annan infrastruktur för att skapa arbetstillfällen och få fart på ekonomin.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Offentliga infrastrukturinvesteringar ökar efterfrågan och kan skapa arbetstillfällen. Därför ligger stimulanspaketet nära keynesiansk finanspolitik."}, {"q": "Staten bör sänka skatterna under en lågkonjunktur för att öka hushållens konsumtion.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Lägre skatt ger hushållen mer pengar kvar efter skatt. Om de konsumerar mer kan företagen öka produktionen och anställa."}, {"q": "Höjda bidrag under en lågkonjunktur kan vara ett sätt att stimulera efterfrågan.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Höjda bidrag stärker hushållens köpkraft. Om pengarna används till konsumtion ökar efterfrågan och företagens behov av arbetskraft."}, {"q": "Under en lågkonjunktur bör staten kunna låna pengar för att finansiera offentliga investeringar.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Lånefinansierade investeringar kan skapa arbetstillfällen när privat efterfrågan är svag. Keynesianismen accepterar därför tillfälliga underskott."}, {"q": "När coronapandemin drabbade den svenska ekonomin gick staten in med ekonomiskt stöd till företag för att motverka uppsägningar och stigande arbetslöshet.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Stödet är ett exempel på hur staten aktivt kan motverka arbetslöshet under en kris. Det ligger nära keynesianismens stabiliseringspolitik."}, {"q": "Under finanskrisen införde den tyska regeringen en skrotningspremie som gav hushållen ekonomiskt stöd om de ersatte sin gamla bil med en ny. Syftet var att stimulera konsumtionen och motverka nedgången i ekonomin.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Premien gjorde bilköp billigare för hushållen och stimulerade efterfrågan. Det är ett exempel på expansiv finanspolitik."}, {"q": "En tillfälligt växande statsskuld kan vara ett acceptabelt pris för att bekämpa konjunkturarbetslösheten.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. En tillfälligt högre statsskuld kan accepteras om stimulanserna motverkar arbetslöshet. Under bättre konjunktur kan staten åter stärka budgeten."}, {"q": "När hushållen minskar sin konsumtion under en ekonomisk kris bör staten kompensera genom ökade utgifter.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. När privat konsumtion faller kan offentliga utgifter kompensera för en del av efterfrågebortfallet. Det kan minska risken för uppsägningar."}, {"q": "Statliga infrastrukturprojekt är ett centralt verktyg för att bekämpa arbetslöshet under en lågkonjunktur.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Infrastrukturprojekt skapar direkt efterfrågan på arbetskraft och material. Lönerna kan sedan ge ytterligare konsumtion genom multiplikatoreffekten."}, {"q": "Staten bör stimulera efterfrågan även om det innebär en risk för något högre inflation.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Vid hög konjunkturarbetslöshet kan ökad efterfrågan skapa jobb. Keynesianismen kan acceptera en viss inflationsrisk för att uppnå detta."}, {"q": "Statens budget behöver inte vara i balans varje år, utan bör anpassas efter konjunkturläget.", "a": ["Keynesianism", "Monetarism"], "f": "Rätt svar: Keynesianism. Keynesianismen betonar budgetens roll över hela konjunkturcykeln. Underskott i lågkonjunktur kan följas av överskott i högkonjunktur."}, {"q": "Teorins främsta företrädare är den amerikanske ekonomen Milton Friedman.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Friedman betonade penningmängdens betydelse för inflationen och kritiserade återkommande finanspolitiska stimulanser."}, {"q": "Teorin fick sitt stora genomslag i samband med 1970-talets ekonomiska kriser.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Under 1970-talet förekom hög inflation samtidigt som arbetslösheten var hög. Monetarismens fokus på prisstabilitet fick då större genomslag."}, {"q": "Stagflationen under 1970-talet stärkte teorins genomslag.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Stagflationen utmanade föreställningen om ett stabilt utbyte mellan inflation och arbetslöshet. Monetarismen betonade att hög inflation inte var en hållbar lösning på arbetslöshet."}, {"q": "Inflationsbekämpning är den främsta ekonomisk-politiska prioriteringen.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Monetarismen betonar att stabila priser skapar bättre långsiktiga förutsättningar för ekonomin. Därför prioriteras inflationsbekämpning."}, {"q": "Kontroll av penningmängden är central för att skapa en stabil ekonomi.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Om penningmängden växer för snabbt i förhållande till produktionen kan inflationen öka. Monetarismen betonar därför en stabil penningmängdsutveckling."}, {"q": "Penningpolitiken prioriteras framför en aktiv finanspolitik.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Monetarismen betonar kontroll av penningmängden och penningpolitik snarare än återkommande förändringar av statens utgifter och skatter."}, {"q": "Penningmängden bör inte långsiktigt öka snabbare än produktionen, eftersom det kan leda till inflation.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Om mer pengar konkurrerar om samma mängd varor och tjänster kan priserna stiga. Därför betonas penningmängdens utveckling i förhållande till produktionen."}, {"q": "Inflation förklaras på lång sikt framför allt av att penningmängden ökar för snabbt.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Enligt monetarismen kan en långvarigt snabb ökning av penningmängden i förhållande till produktionen driva inflationen."}, {"q": "Staten bör ha en begränsad roll i samhällsekonomin.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Monetarismens marknadsliberala syn betonar marknadens funktionssätt och en mer begränsad statlig roll än keynesianismen."}, {"q": "Fria marknader och konkurrens är centrala för en välfungerande ekonomi.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Konkurrens kan ge företag incitament att effektivisera produktionen och erbjuda bättre produkter. Detta ligger nära monetarismens marknadsliberala syn."}, {"q": "Avregleringar är ett viktigt verktyg för att effektivisera marknaden.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Avregleringar kan minska hinder för konkurrens och etablering. Syftet är att förbättra marknadens funktionssätt."}, {"q": "Staten bör undvika att regelbundet använda budgetunderskott för att stimulera efterfrågan.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Monetarismen är kritisk till återkommande efterfrågestimulanser eftersom de kan öka inflationen utan att varaktigt sänka jämviktsarbetslösheten."}, {"q": "Låga skatter, begränsade bidrag och färre regleringar är viktiga inslag i teorins marknadsliberala synsätt.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. I monetarismens marknadsliberala syn betonas ekonomiska incitament, konkurrens och en begränsad statlig roll."}, {"q": "Den vertikala Phillipskurvan visar varför arbetslösheten inte långsiktigt kan hållas under jämviktsarbetslösheten genom ökad efterfrågan.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Den vertikala Phillipskurvan visar att arbetslösheten på lång sikt återgår mot jämviktsnivån även om inflationen ökar."}, {"q": "När inflationen steg kraftigt i Sverige under 2022 höjde Riksbanken styrräntan vid flera tillfällen. Inflationsbekämpningen prioriterades trots risken för minskad ekonomisk tillväxt och stigande arbetslöshet.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Högre styrränta kan höja marknadsräntorna och dämpa efterfrågan. Prioriteringen av inflationen ligger nära monetarismens synsätt, även om åtgärden inte är unik för teorin."}, {"q": "Expansiv finanspolitik kan tillfälligt pressa arbetslösheten under jämviktsnivån, men effekten är inte bestående.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Ökad efterfrågan kan tillfälligt skapa fler jobb. När löner och inflationsförväntningar anpassas återgår arbetslösheten mot jämviktsnivån."}, {"q": "Försök att med expansiv finanspolitik pressa arbetslösheten under jämviktsnivån genom ökad efterfrågan leder till stigande inflation.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Enligt monetarismen anpassas löner och inflationsförväntningar på sikt. Fortsatta stimulanser för att hålla arbetslösheten under jämviktsnivån kan därför driva upp inflationen."}, {"q": "När USA drabbades av hög inflation valde centralbanken under ledning av Paul Volcker att strama åt penningpolitiken och begränsa penningmängdens tillväxt. Inflationsbekämpningen prioriterades trots risken för lågkonjunktur och högre arbetslöshet.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Åtstramningen syftade till att dämpa inflationen genom penningpolitiken. Prioriteringen av prisstabilitet ligger nära monetarismens synsätt."}, {"q": "Arbetslösheten bör långsiktigt bekämpas genom att sänka jämviktsarbetslösheten.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Jämviktsarbetslösheten påverkas av arbetsmarknadens funktionssätt. Monetarismen betonar därför strukturella åtgärder snarare än ständiga stimulanser."}, {"q": "Selektiva arbetsmarknadspolitiska åtgärder prioriteras framför generella efterfrågestimulanser för att minska jämviktsarbetslösheten.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Selektiva åtgärder riktas mot konkreta problem som kompetensbrist. De kan minska jämviktsarbetslösheten utan att generellt öka efterfrågan."}, {"q": "Förbättrad matchning mellan arbetssökande och arbetsgivare kan bidra till att sänka jämviktsarbetslösheten.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Bättre matchning gör att arbetssökande snabbare hittar lämpliga jobb. Det kan minska friktionsarbetslösheten och därmed jämviktsarbetslösheten."}, {"q": "Utbildningsinsatser som minskar strukturarbetslösheten är att föredra framför expansiv finanspolitik för att sänka arbetslösheten.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Utbildning kan ge arbetslösa den kompetens som företagen efterfrågar. Generella stimulanser löser inte automatiskt denna kompetensbrist."}, {"q": "Vid hög inflation bör penningpolitiska åtgärder prioriteras framför finanspolitiska åtgärder.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Restriktiv penningpolitik kan dämpa efterfrågan och inflationstrycket. Monetarismen prioriterar detta verktyg framför aktiv finanspolitik."}, {"q": "Under en lågkonjunktur bör penningpolitiska åtgärder prioriteras framför ökade statliga utgifter.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. När inflationen är låg kan expansiv penningpolitik stimulera konsumtion och investeringar. Det ligger närmare monetarismens val av verktyg än ökade statliga utgifter."}, {"q": "En effektivare arbetsmarknad kan långsiktigt minska arbetslösheten utan att skapa ett ökat inflationstryck.", "a": ["Monetarism", "Keynesianism"], "f": "Rätt svar: Monetarism. Bättre matchning och kompetens kan göra att fler får arbete utan att efterfrågan behöver pressas upp. Därmed kan jämviktsarbetslösheten sjunka."}], quiz=[{"q": "Finanspolitik är ett centralt verktyg inom keynesianismen. Vad innebär expansiv finanspolitik?", "a": ["Staten stimulerar efterfrågan genom skatter och offentliga utgifter.", "Centralbanken sänker styrräntan.", "Staten minskar sina utgifter för att motverka inflation.", "Centralbanken begränsar penningmängdens tillväxt."], "n": 1, "g": 0, "f": "Rätt svar: Staten stimulerar efterfrågan genom skatter och offentliga utgifter. Expansiv finanspolitik innebär exempelvis sänkta skatter eller ökade offentliga utgifter. Syftet är att öka efterfrågan och därmed produktion och sysselsättning."}, {"q": "Vilka två åtgärder är exempel på restriktiv finanspolitik?", "a": ["Staten höjer inkomstskatten.", "Staten minskar de offentliga investeringarna.", "Riksbanken höjer styrräntan.", "Riksbanken sänker styrräntan."], "n": 2, "g": 0, "f": "Rätt svar: Staten höjer inkomstskatten / Staten minskar de offentliga investeringarna. Högre inkomstskatt minskar hushållens köpkraft och färre offentliga investeringar minskar statens efterfrågan. Båda åtgärderna bromsar ekonomin."}, {"q": "Stagflationen på 1970-talet bidrog till monetarismens genomslag. Vad innebär stagflation?", "a": ["Hög inflation, hög arbetslöshet och svag ekonomisk tillväxt.", "Låg inflation och hög arbetslöshet.", "Hög inflation och hög ekonomisk tillväxt.", "Låg arbetslöshet och låg ekonomisk tillväxt."], "n": 1, "g": 0, "f": "Rätt svar: Hög inflation, hög arbetslöshet och svag ekonomisk tillväxt. Stagflation innebär att hög inflation sammanfaller med svag ekonomisk utveckling och hög arbetslöshet. Det gör stabiliseringspolitiken svårare."}, {"q": "Inom monetarismen är NAIRU (jämviktsarbetslöshet) ett centralt begrepp. Vilka två former av arbetslöshet ingår?", "a": ["Strukturarbetslöshet.", "Friktionsarbetslöshet.", "Konjunkturarbetslöshet.", "Efterfrågerelaterad arbetslöshet."], "n": 2, "g": 0, "f": "Rätt svar: Strukturarbetslöshet / Friktionsarbetslöshet. Strukturarbetslöshet beror på att kompetens och jobb inte matchar, medan friktionsarbetslöshet uppstår mellan arbeten. Konjunkturarbetslöshet beror däremot på svag efterfrågan."}, {"q": "Multiplikatoreffekten är ett centralt begrepp inom Keynesianismen. Vad innebär den?", "a": ["En ursprunglig investering kan skapa ytterligare ekonomisk aktivitet i flera led.", "En höjd styrränta ökar statens skatteintäkter i flera led.", "En ökad penningmängd ökar alltid produktionen lika mycket.", "En minskad statsskuld ökar automatiskt privata investeringar."], "n": 1, "g": 0, "f": "Rätt svar: En ursprunglig investering kan skapa ytterligare ekonomisk aktivitet i flera led. Investeringen ger inkomster som delvis används till nya inköp. Dessa inköp skapar i sin tur inkomster i andra branscher."}, {"q": "Vilka två påståenden om styrränta och marknadsränta stämmer?", "a": ["Styrräntan bestäms av centralbanken.", "Bankernas marknadsräntor påverkas bland annat av styrräntan.", "Marknadsräntan bestäms direkt av regeringen.", "Styrräntan bestäms gemensamt av affärsbankerna."], "n": 2, "g": 0, "f": "Rätt svar: Styrräntan bestäms av centralbanken / Bankernas marknadsräntor påverkas bland annat av styrräntan. Centralbanken bestämmer styrräntan, medan bankerna bestämmer sina marknadsräntor. Styrräntan påverkar bankernas räntor men är inte den enda faktorn."}, {"q": "Keynesianismen betonar kontracyklisk stabiliseringspolitik. Vad innebär det?", "a": ["Att motverka konjunktursvängningar genom ekonomisk-politiska åtgärder.", "Att förstärka konjunkturens utveckling genom ekonomisk-politiska åtgärder.", "Att bedriva samma ekonomiska politik oavsett konjunkturläge.", "Att endast förändra politiken när inflationen stiger."], "n": 1, "g": 0, "f": "Rätt svar: Att motverka konjunktursvängningar genom ekonomisk-politiska åtgärder. Politiken går emot konjunkturen: stimulera efterfrågan i lågkonjunktur och bromsa den i högkonjunktur. Syftet är att minska svängningarna."}, {"q": "Vilka två situationer är exempel på strukturarbetslöshet?", "a": ["Industriarbetare förlorar jobbet vid automatisering och saknar kompetens för nya arbeten.", "Lediga IT-jobb finns samtidigt som arbetssökande saknar rätt utbildning.", "En person är arbetslös några veckor mellan två anställningar.", "Ett företag säger upp personal på grund av tillfälligt svag efterfrågan."], "n": 2, "g": 0, "f": "Rätt svar: Industriarbetare förlorar jobbet vid automatisering och saknar kompetens för nya arbeten / Lediga IT-jobb finns samtidigt som arbetssökande saknar rätt utbildning. Båda exemplen handlar om att arbetskraftens kompetens inte motsvarar de lediga jobbens krav. Det är strukturarbetslöshet, inte enbart brist på efterfrågan."}, {"q": "Vad innebär efterfrågedriven inflation?", "a": ["Efterfrågan på varor och tjänster ökar snabbare än produktionen.", "Produktionskostnaderna ökar på grund av dyrare råvaror.", "Arbetslösheten stiger när företagen minskar produktionen.", "Priserna stiger till följd av minskad konkurrens."], "n": 1, "g": 0, "f": "Rätt svar: Efterfrågan på varor och tjänster ökar snabbare än produktionen. När efterfrågan ökar snabbare än företagen kan öka produktionen uppstår ett tryck uppåt på priserna. Det kallas efterfrågedriven inflation."}, {"q": "Vilka två påståenden beskriver budgetunderskott och statsskuld korrekt?", "a": ["Budgetunderskott innebär att statens utgifter överstiger inkomsterna.", "Återkommande lånefinansierade underskott kan öka statsskulden.", "Budgetunderskott innebär att inkomsterna överstiger utgifterna.", "Statsskuld och budgetunderskott är samma sak."], "n": 2, "g": 0, "f": "Rätt svar: Budgetunderskott innebär att statens utgifter överstiger inkomsterna / Återkommande lånefinansierade underskott kan öka statsskulden. Ett budgetunderskott är skillnaden när utgifterna överstiger inkomsterna under en period. Statsskulden är den samlade skulden och kan växa när underskott lånefinansieras."}, {"q": "Sverige befinner sig i en djup lågkonjunktur. Hushållen konsumerar mindre och företagen säger upp personal. Vilken åtgärd skulle en keynesian främst förespråka?", "a": ["Ökade offentliga investeringar för att stimulera efterfrågan.", "Höjda skatter för att förbättra statens budget.", "Minskade offentliga utgifter för att begränsa statsskulden.", "Höjd styrränta för att begränsa hushållens skuldsättning."], "n": 1, "g": 1, "f": "Rätt svar: Ökade offentliga investeringar för att stimulera efterfrågan. Offentliga investeringar kompenserar för en del av den svaga privata efterfrågan. Företagen får fler beställningar och kan behålla eller anställa personal."}, {"q": "Ett land har hög arbetslöshet till följd av svag efterfrågan. Vilka två åtgärder skulle en keynesian förespråka?", "a": ["Sänkta inkomstskatter för hushållen.", "Ökade statliga investeringar i infrastruktur.", "Minskade bidrag till ekonomiskt utsatta hushåll.", "Höjd styrränta för att minska konsumtionen."], "n": 2, "g": 1, "f": "Rätt svar: Sänkta inkomstskatter för hushållen / Ökade statliga investeringar i infrastruktur. Sänkta skatter stärker hushållens köpkraft, medan infrastrukturinvesteringar direkt ökar efterfrågan. Båda är expansiv finanspolitik."}, {"q": "Ett land befinner sig i kraftig högkonjunktur. Företagen har svårt att hitta arbetskraft och priserna stiger snabbt. Vilken åtgärd ligger närmast keynesianismen?", "a": ["Höjda skatter för att minska efterfrågan.", "Sänkta skatter för att stimulera konsumtionen.", "Ökade offentliga investeringar för att skapa arbetstillfällen.", "Höjda bidrag för att öka köpkraften."], "n": 1, "g": 1, "f": "Rätt svar: Höjda skatter för att minska efterfrågan. Höjda skatter minskar hushållens köpkraft och kan dämpa efterfrågan. Det är restriktiv finanspolitik som motverkar överhettning."}, {"q": "Regeringen vill bedriva restriktiv finanspolitik för att motverka överhettning. Vilka två åtgärder bör den välja?", "a": ["Minska offentliga investeringar.", "Höja vissa skatter.", "Höja bostadsbidraget.", "Sänka inkomstskatten."], "n": 2, "g": 1, "f": "Rätt svar: Minska offentliga investeringar / Höja vissa skatter. Minskade investeringar sänker statens efterfrågan och högre skatter minskar privat köpkraft. Båda åtgärderna är restriktiva."}, {"q": "Under en lågkonjunktur får byggföretagen färre beställningar. Många byggnadsarbetare riskerar att bli arbetslösa. Vilken åtgärd skulle en keynesian föreslå?", "a": ["Staten tidigarelägger investeringar i järnvägar och bostäder.", "Staten minskar investeringarna för att undvika underskott.", "Staten höjer skatterna för att finansiera framtida investeringar.", "Staten avstår från investeringar och inväntar återhämtning."], "n": 1, "g": 1, "f": "Rätt svar: Staten tidigarelägger investeringar i järnvägar och bostäder. Tidigarelagda byggprojekt ger byggföretagen nya beställningar när privata beställningar minskar. Därmed kan uppsägningar motverkas."}, {"q": "Under en lågkonjunktur får kommunerna mindre skatteintäkter. De riskerar därför att behöva säga upp personal. Vilka två åtgärder skulle en keynesian kunna föreslå?", "a": ["Höja statsbidragen så att kommunerna kan behålla personal.", "Acceptera ett tillfälligt statligt budgetunderskott för att finansiera stödet.", "Minska statsbidragen för att förbättra statens budget.", "Höja inkomstskatterna för att minska konsumtionen."], "n": 2, "g": 1, "f": "Rätt svar: Höja statsbidragen så att kommunerna kan behålla personal / Acceptera ett tillfälligt statligt budgetunderskott för att finansiera stödet. Statsbidrag kan hjälpa kommunerna att behålla personal och undvika ytterligare efterfrågebortfall. Ett tillfälligt underskott kan finansiera stödet."}, {"q": "Ett land har haft högkonjunktur i flera år och staten har goda skatteintäkter. Hur bör staten agera enligt keynesianismen?", "a": ["Skapa budgetöverskott och utrymme inför kommande lågkonjunkturer.", "Öka utgifterna för att förstärka högkonjunkturen.", "Sänka skatterna för att ytterligare öka konsumtionen.", "Låna pengar för ytterligare offentliga investeringar."], "n": 1, "g": 1, "f": "Rätt svar: Skapa budgetöverskott och utrymme inför kommande lågkonjunkturer. Under högkonjunkturen är behovet av stimulanser mindre. Budgetöverskott skapar utrymme för framtida lågkonjunkturer."}, {"q": "Ett land drabbas av en ekonomisk kris. Hushållen börjar spara en större del av inkomsterna. Vilka två åtgärder skulle en keynesian kunna föreslå?", "a": ["Öka statens efterfrågan genom offentliga investeringar.", "Tillfälligt höja bidragen för att stärka köpkraften.", "Höja skatterna för att minska lånebehovet.", "Minska ersättningen till arbetslösa."], "n": 2, "g": 1, "f": "Rätt svar: Öka statens efterfrågan genom offentliga investeringar / Tillfälligt höja bidragen för att stärka köpkraften. När hushållen sparar mer minskar konsumtionen. Offentliga investeringar och höjda bidrag kan kompensera för en del av efterfrågebortfallet."}, {"q": "Regeringen vill minska konjunkturarbetslösheten. Staten har redan ett budgetunderskott. Hur skulle en keynesian resonera?", "a": ["Ett tillfälligt större underskott kan accepteras för att stimulera efterfrågan.", "Budgeten måste balanseras innan ekonomin stimuleras.", "Staten bör höja skatterna för att omedelbart minska underskottet.", "Staten bör minska utgifterna tills arbetslösheten sjunkit."], "n": 1, "g": 1, "f": "Rätt svar: Ett tillfälligt större underskott kan accepteras för att stimulera efterfrågan. Keynesianismen prioriterar att motverka konjunkturarbetslöshet när efterfrågan är svag. Ett tillfälligt underskott kan därför accepteras."}, {"q": "Ett land har låg inflation och hög konjunkturarbetslöshet. Företagen har möjlighet att producera mer. Vilka två åtgärder skulle en keynesian föreslå?", "a": ["Öka offentliga utgifter för att skapa ekonomisk aktivitet.", "Sänka skatterna för att stimulera privat konsumtion.", "Höja skatterna för att minska efterfrågan.", "Minska bidragen för att skapa budgetöverskott."], "n": 2, "g": 1, "f": "Rätt svar: Öka offentliga utgifter för att skapa ekonomisk aktivitet / Sänka skatterna för att stimulera privat konsumtion. När det finns ledig produktionskapacitet kan ökade utgifter och sänkta skatter öka efterfrågan. Företagen kan då producera mer och anställa fler."}, {"q": "Under en lågkonjunktur sänker regeringen inkomstskatten. Vilken utveckling vill regeringen uppnå med denna expansiva finanspolitik?", "a": ["Ökad köpkraft, ökad efterfrågan och lägre arbetslöshet.", "Minskad köpkraft, minskad efterfrågan och lägre produktion.", "Ökad köpkraft, minskad efterfrågan och högre arbetslöshet.", "Minskad köpkraft, ökad efterfrågan och högre produktion."], "n": 1, "g": 2, "f": "Rätt svar: Ökad köpkraft, ökad efterfrågan och lägre arbetslöshet. Sänkt inkomstskatt ger hushållen mer pengar kvar. Om konsumtionen ökar får företagen fler beställningar och kan anställa fler."}, {"q": "Staten lånar pengar för stora investeringar under en lågkonjunktur. Vilka två konsekvenser är sannolika på kort sikt?", "a": ["Efterfrågan på varor och tjänster ökar.", "Fler arbetstillfällen kan skapas.", "Statsskulden minskar till följd av upplåningen.", "Konsumtionen minskar när fler får arbete."], "n": 2, "g": 2, "f": "Rätt svar: Efterfrågan på varor och tjänster ökar / Fler arbetstillfällen kan skapas. Statens investeringar ökar efterfrågan direkt och kan skapa nya jobb. De nya inkomsterna kan dessutom stimulera konsumtionen."}, {"q": "Staten finansierar en järnväg. Byggnadsarbetarna konsumerar delar av lönerna och efterfrågan ökar i andra branscher. Vad illustrerar detta?", "a": ["Multiplikatoreffekten.", "Den vertikala Phillipskurvan.", "Jämviktsarbetslösheten.", "Restriktiv finanspolitik."], "n": 1, "g": 2, "f": "Rätt svar: Multiplikatoreffekten. Byggnadsarbetarnas löner används delvis till inköp som skapar inkomster i andra branscher. Detta är multiplikatoreffekten."}, {"q": "Regeringen bedriver kraftigt expansiv finanspolitik trots att landet redan har högkonjunktur. Vilka två risker finns?", "a": ["Efterfrågedriven inflation ökar.", "Ekonomin riskerar att överhettas.", "Efterfrågan blir för låg i förhållande till produktionen.", "Företagen får större överskott av arbetskraft."], "n": 2, "g": 2, "f": "Rätt svar: Efterfrågedriven inflation ökar / Ekonomin riskerar att överhettas. När ekonomin redan har hög aktivitet kan extra efterfrågan överstiga produktionskapaciteten. Det riskerar att skapa överhettning och efterfrågedriven inflation."}, {"q": "Under en lågkonjunktur höjer staten skatterna och minskar utgifterna. Vilken konsekvens skulle en keynesian främst varna för?", "a": ["Efterfrågan kan minska ytterligare och arbetslösheten stiga.", "Efterfrågan kan öka ytterligare och arbetslösheten sjunka.", "Köpkraften kan öka och ekonomin överhettas.", "Företagens försäljning kan öka när hushållen får mindre pengar."], "n": 1, "g": 2, "f": "Rätt svar: Efterfrågan kan minska ytterligare och arbetslösheten stiga. Högre skatter och lägre offentliga utgifter minskar efterfrågan ytterligare. Företagen kan då minska produktionen och säga upp fler."}, {"q": "Staten höjer bidragen för att öka efterfrågan under en lågkonjunktur. Vilka två omständigheter kan göra att efterfrågan i landet ökar mindre än väntat?", "a": ["Hushållen sparar en stor del av pengarna.", "Hushållen köper till stor del importerade varor.", "Hushållen köper varor producerade i Sverige.", "Företagen anställer fler för att möta efterfrågan."], "n": 2, "g": 2, "f": "Rätt svar: Hushållen sparar en stor del av pengarna / Hushållen köper till stor del importerade varor. Sparande innebär att pengarna inte omedelbart används till konsumtion. Import innebär att en del av efterfrågan riktas mot produktion utomlands, vilket försvagar den inhemska multiplikatoreffekten."}, {"q": "Expansiv finanspolitik har minskat arbetslösheten, men inflationen börjar stiga. Hur skulle en keynesian resonera utifrån den traditionella Phillipskurvan?", "a": ["Något högre inflation kan accepteras för att uppnå lägre arbetslöshet.", "Lägre arbetslöshet måste alltid leda till lägre inflation.", "Stigande inflation innebär att finanspolitiken inte påverkat arbetslösheten.", "Inflation och arbetslöshet kan inte påverkas av efterfrågan."], "n": 1, "g": 2, "f": "Rätt svar: Något högre inflation kan accepteras för att uppnå lägre arbetslöshet. Den traditionella Phillipskurvan illustrerar ett kortsiktigt samband mellan inflation och arbetslöshet. En keynesian kan acceptera något högre inflation för att minska konjunkturarbetslösheten."}, {"q": "Staten minskar sina utgifter och höjer skatterna under en högkonjunktur. Vilka två effekter vill staten uppnå?", "a": ["Minskat inflationstryck genom lägre efterfrågan.", "Förbättrat budgetsaldo för staten.", "Kraftigt ökad konsumtion.", "Ökad risk för överhettning."], "n": 2, "g": 2, "f": "Rätt svar: Minskat inflationstryck genom lägre efterfrågan / Förbättrat budgetsaldo för staten. Högre skatter och lägre utgifter dämpar efterfrågan och inflationstrycket. Samtidigt kan statens budgetsaldo förbättras."}, {"q": "Staten lånar till ett infrastrukturprojekt som skapar arbetstillfällen. Fler börjar betala inkomstskatt. Hur kan statens ekonomi påverkas?", "a": ["Ökade skatteintäkter kan delvis kompensera för ökade utgifter.", "Skatteintäkterna minskar när fler får arbete.", "Statsskulden försvinner automatiskt när arbetslösheten minskar.", "Bidragsutgifterna ökar automatiskt när fler får arbete."], "n": 1, "g": 2, "f": "Rätt svar: Ökade skatteintäkter kan delvis kompensera för ökade utgifter. När fler arbetar ökar skatteintäkterna och behovet av vissa bidrag kan minska. Det kan delvis kompensera för investeringens kostnad."}, {"q": "Staten försöker få fart på ekonomin med stora ekonomiska stimulanser under en lågkonjunktur. Vilka två tecken visar att politiken börjar fungera?", "a": ["Företagen får fler beställningar och ökar produktionen.", "Fler får arbete och konjunkturarbetslösheten minskar.", "Konsumtionen minskar ytterligare.", "Företagen minskar investeringarna på grund av svag efterfrågan."], "n": 2, "g": 2, "f": "Rätt svar: Företagen får fler beställningar och ökar produktionen / Fler får arbete och konjunkturarbetslösheten minskar. Fler beställningar och ökad produktion visar att efterfrågan återhämtas. När företagen anställer fler minskar konjunkturarbetslösheten."}, {"q": "Sverige har hög inflation samtidigt som arbetslösheten börjar stiga. Vilken åtgärd ligger närmast monetarismens prioriteringar?", "a": ["Restriktiv penningpolitik för att motverka inflationen.", "Sänkta skatter för att stimulera efterfrågan.", "Ökade offentliga investeringar för att skapa arbetstillfällen.", "Höjda bidrag för att stärka köpkraften."], "n": 1, "g": 3, "f": "Rätt svar: Restriktiv penningpolitik för att motverka inflationen. Monetarismen prioriterar att dämpa inflationen. Restriktiv penningpolitik kan minska efterfrågan även om arbetslösheten riskerar att stiga på kort sikt."}, {"q": "Ett land har hög efterfrågedriven inflation. Vilka två åtgärder ligger närmast monetarismens rekommendationer?", "a": ["Höja styrräntan för att dämpa efterfrågan.", "Begränsa penningmängdens tillväxt.", "Öka offentliga investeringar för att stimulera ekonomin.", "Sänka styrräntan för att göra lån billigare."], "n": 2, "g": 3, "f": "Rätt svar: Höja styrräntan för att dämpa efterfrågan / Begränsa penningmängdens tillväxt. Högre styrränta kan dämpa konsumtion och investeringar. Begränsad penningmängdstillväxt motverkar att efterfrågan långsiktigt växer snabbare än produktionen."}, {"q": "Ett land har hög arbetslöshet samtidigt som företag saknar personal med rätt utbildning. Vilken åtgärd skulle en monetarist främst förespråka?", "a": ["Riktade utbildningsinsatser för bättre matchning.", "Generella bidragshöjningar för att stimulera konsumtionen.", "Stora statliga byggprojekt för att öka efterfrågan.", "Generella skattesänkningar för att öka efterfrågan."], "n": 1, "g": 3, "f": "Rätt svar: Riktade utbildningsinsatser för bättre matchning. Problemet är bristande matchning, inte nödvändigtvis svag efterfrågan. Riktad utbildning kan ge arbetslösa den kompetens företagen behöver."}, {"q": "Regeringen vill långsiktigt minska jämviktsarbetslösheten. Vilka två åtgärder ligger närmast monetarismen?", "a": ["Utbildningsinsatser anpassade efter arbetsmarknadens behov.", "Effektivare matchning mellan arbetssökande och arbetsgivare.", "Återkommande lånefinansierade offentliga investeringar.", "Generella bidragshöjningar för att öka efterfrågan."], "n": 2, "g": 3, "f": "Rätt svar: Utbildningsinsatser anpassade efter arbetsmarknadens behov / Effektivare matchning mellan arbetssökande och arbetsgivare. Utbildning kan minska kompetensbristen och bättre matchning kan förkorta tiden mellan jobb. Båda kan sänka jämviktsarbetslösheten."}, {"q": "Ett land har lågkonjunktur och mycket låg inflation. Vilken åtgärd skulle en monetarist främst föreslå för att stimulera ekonomin?", "a": ["Sänkt styrränta för att stimulera konsumtion och investeringar.", "Ökade offentliga investeringar genom statlig upplåning.", "Höjda bidrag genom större budgetunderskott.", "Höjd styrränta för att begränsa konsumtionen."], "n": 1, "g": 3, "f": "Rätt svar: Sänkt styrränta för att stimulera konsumtion och investeringar. Lägre styrränta kan sänka marknadsräntorna och göra lån billigare. Det kan stimulera konsumtion och investeringar utan att staten ökar sina utgifter."}, {"q": "En regering vill göra ekonomin mer marknadsliberal, i linje med monetarismens synsätt. Vilka två förändringar passar bäst?", "a": ["Avreglera marknader där onödiga regler begränsar konkurrensen.", "Minska hinder för nya företag att etablera sig.", "Öka statens ägande i konkurrensutsatta branscher.", "Införa statligt fastställda priser på fler varor."], "n": 2, "g": 3, "f": "Rätt svar: Avreglera marknader där onödiga regler begränsar konkurrensen / Minska hinder för nya företag att etablera sig. Färre onödiga etableringshinder kan göra det lättare för företag att konkurrera. Detta ligger nära monetarismens marknadsliberala synsätt."}, {"q": "Penningmängden har i flera år ökat betydligt snabbare än produktionen och inflationen stiger. Vad skulle en monetarist förespråka?", "a": ["Begränsa penningmängdens tillväxt för att stabilisera prisutvecklingen.", "Öka penningmängden ytterligare för att stimulera efterfrågan.", "Öka statens utgifter för att stärka köpkraften.", "Sänka styrräntan för att öka utlåningen."], "n": 1, "g": 3, "f": "Rätt svar: Begränsa penningmängdens tillväxt för att stabilisera prisutvecklingen. När penningmängden växer snabbare än produktionen kan priserna stiga. Monetarismen betonar därför en stabilare penningmängdsutveckling."}, {"q": "I flera branscher är priserna höga och konkurrensen svag. Vilka två åtgärder passar monetarismens marknadsliberala synsätt?", "a": ["Underlätta för nya företag att etablera sig.", "Motverka monopol som hindrar fungerande konkurrens.", "Införa fler statliga monopol.", "Begränsa antalet företag som får bedriva verksamhet."], "n": 2, "g": 3, "f": "Rätt svar: Underlätta för nya företag att etablera sig / Motverka monopol som hindrar fungerande konkurrens. Nya företag och motverkande av monopol kan stärka konkurrensen. Företagen får då större incitament att effektivisera och konkurrera med pris och kvalitet."}, {"q": "Arbetslösheten ligger på jämviktsnivån. Regeringen vill minska den genom att bedriva expansiv finanspolitik gång på gång. Vad skulle en monetarist föreslå i stället?", "a": ["Strukturella reformer som kan sänka jämviktsarbetslösheten.", "Öka offentliga utgifter tills arbetslösheten sjunkit permanent.", "Höja bidragen för att permanent öka efterfrågan.", "Acceptera stigande inflation för att permanent hålla arbetslösheten under jämviktsnivån."], "n": 1, "g": 3, "f": "Rätt svar: Strukturella reformer som kan sänka jämviktsarbetslösheten. Återkommande efterfrågestimulanser kan inte varaktigt hålla arbetslösheten under jämviktsnivån enligt monetarismen. Strukturella reformer kan däremot förbättra arbetsmarknadens funktionssätt."}, {"q": "Ett land drabbas av stagflation: hög inflation och hög arbetslöshet samtidigt som ekonomin utvecklas svagt. Vilka två åtgärder skulle en monetarist prioritera?", "a": ["Bekämpa inflationen genom restriktiv penningpolitik.", "Förbättra arbetsmarknadens funktionssätt genom selektiva åtgärder.", "Öka efterfrågan genom stora statliga investeringar.", "Sänka styrräntan för att snabbt öka konsumtionen."], "n": 2, "g": 3, "f": "Rätt svar: Bekämpa inflationen genom restriktiv penningpolitik / Förbättra arbetsmarknadens funktionssätt genom selektiva åtgärder. Restriktiv penningpolitik riktas mot inflationen, medan selektiva arbetsmarknadsåtgärder riktas mot strukturella problem. Därmed angrips problemen med olika verktyg."}, {"q": "Riksbanken höjer styrräntan för att bekämpa inflationen. Vilken utveckling är mest sannolik?", "a": ["Högre marknadsräntor, minskad efterfrågan och lägre inflationstryck.", "Lägre marknadsräntor, ökad konsumtion och stigande inflation.", "Högre marknadsräntor, ökade investeringar och stigande inflation.", "Lägre marknadsräntor, minskade investeringar och lägre inflationstryck."], "n": 1, "g": 4, "f": "Rätt svar: Högre marknadsräntor, minskad efterfrågan och lägre inflationstryck. Högre styrränta kan höja marknadsräntorna och göra lån dyrare. Konsumtion och investeringar kan minska, vilket dämpar inflationstrycket."}, {"q": "Riksbanken sänker styrräntan under lågkonjunktur. Vilka två konsekvenser kan åtgärden få?", "a": ["Hushållens lånekostnader minskar när bankerna sänker räntorna.", "Efterfrågan ökar när konsumtion och investeringar stimuleras.", "Företagens investeringar minskar eftersom lån blir dyrare.", "Hushållens ränteutgifter ökar till följd av räntesänkningen."], "n": 2, "g": 4, "f": "Rätt svar: Hushållens lånekostnader minskar när bankerna sänker räntorna / Efterfrågan ökar när konsumtion och investeringar stimuleras. När marknadsräntorna sjunker kan hushållens lånekostnader minska. Billigare lån kan också stimulera konsumtion och investeringar, vilket ökar efterfrågan."}, {"q": "Penningmängden ökar kraftigt medan produktionen är oförändrad. Efterfrågan ökar. Vad förväntar sig en monetarist?", "a": ["Priserna stiger eftersom efterfrågan ökar utan motsvarande produktionsökning.", "Priserna sjunker eftersom hushållen har mer pengar.", "Produktionen ökar automatiskt lika mycket som penningmängden.", "Inflationen minskar eftersom efterfrågan ökar."], "n": 1, "g": 4, "f": "Rätt svar: Priserna stiger eftersom efterfrågan ökar utan motsvarande produktionsökning. När efterfrågan ökar men produktionen är oförändrad konkurrerar köparna om samma mängd varor och tjänster. Det kan pressa upp priserna."}, {"q": "Centralbanken bedriver kraftigt restriktiv penningpolitik för att dämpa inflationen. Vilka två negativa konsekvenser kan uppstå på kort sikt?", "a": ["Företagens investeringar minskar.", "Konjunkturarbetslösheten stiger.", "Hushållens konsumtion ökar kraftigt.", "Företagens efterfrågan på arbetskraft ökar kraftigt."], "n": 2, "g": 4, "f": "Rätt svar: Företagens investeringar minskar / Konjunkturarbetslösheten stiger. Dyrare lån kan få företag att skjuta upp investeringar. Svagare efterfrågan kan även minska produktionen och öka konjunkturarbetslösheten."}, {"q": "Regeringen försöker få ner arbetslösheten under jämviktsnivån med expansiv finanspolitik. Vad händer på lång sikt enligt monetarismen?", "a": ["Arbetslösheten återgår mot jämviktsnivån samtidigt som inflationen blir högre.", "Arbetslösheten förblir permanent lägre utan att inflationen påverkas.", "Jämviktsarbetslösheten sjunker automatiskt när efterfrågan ökar.", "Arbetslösheten och inflationen sjunker permanent."], "n": 1, "g": 4, "f": "Rätt svar: Arbetslösheten återgår mot jämviktsnivån samtidigt som inflationen blir högre. Enligt monetarismen anpassas löner och inflationsförväntningar på sikt. Arbetslösheten återgår mot jämviktsnivån medan inflationen blir högre."}, {"q": "Staten erbjuder arbetslösa utbildning inom yrken där företag har svårt att hitta personal. Vilka två konsekvenser kan det få?", "a": ["Strukturarbetslösheten minskar när fler får efterfrågad kompetens.", "Jämviktsarbetslösheten kan sjunka när arbetsmarknaden fungerar bättre.", "Företagens möjligheter att rekrytera försämras.", "Penningmängden ökar automatiskt."], "n": 2, "g": 4, "f": "Rätt svar: Strukturarbetslösheten minskar när fler får efterfrågad kompetens / Jämviktsarbetslösheten kan sjunka när arbetsmarknaden fungerar bättre. Utbildningen kan minska skillnaden mellan arbetssökandes kompetens och företagens behov. Det minskar strukturarbetslösheten och kan sänka jämviktsarbetslösheten."}, {"q": "Riksbanken sänker styrräntan under längre tid. Hushållen lånar mer och konsumtionen ökar kraftigt. Vilken risk uppstår om produktionen inte ökar lika snabbt?", "a": ["Efterfrågedriven inflation stiger när efterfrågan överstiger produktionskapaciteten.", "Kostnadsdriven inflation minskar eftersom konsumtionen ökar.", "Efterfrågan minskar eftersom hushållen lånar mer.", "Jämviktsarbetslösheten försvinner när konsumtionen ökar."], "n": 1, "g": 4, "f": "Rätt svar: Efterfrågedriven inflation stiger när efterfrågan överstiger produktionskapaciteten. Om konsumtionen ökar snabbare än produktionen kan företagen inte möta hela efterfrågan. Då riskerar priserna att stiga snabbare."}, {"q": "En regering tar bort regler som hindrar nya företag från att konkurrera på en marknad. Vilka två positiva effekter kan uppstå enligt ett marknadsliberalt synsätt?", "a": ["Konkurrensen kan bidra till lägre priser.", "Företagen får starkare incitament att förbättra produkter och effektivisera produktionen.", "Företagens möjligheter att etablera sig försämras.", "Företagens incitament att effektivisera minskar."], "n": 2, "g": 4, "f": "Rätt svar: Konkurrensen kan bidra till lägre priser / Företagen får starkare incitament att förbättra produkter och effektivisera produktionen. Starkare konkurrens kan pressa priserna och ge företag incitament att förbättra produkter och effektivisera. Effekterna är möjliga, inte garanterade."}, {"q": "Inflationen sjunker från 9 procent till 2 procent efter en period med höga räntor. Vad innebär detta?", "a": ["Priserna stiger fortfarande, men långsammare än tidigare.", "Den allmänna prisnivån har sjunkit med 7 procent.", "Varor kostar återigen lika mycket som före inflationsökningen.", "Köpkraften har automatiskt återgått till tidigare nivå."], "n": 1, "g": 4, "f": "Rätt svar: Priserna stiger fortfarande, men långsammare än tidigare. Två procents inflation betyder att den allmänna prisnivån fortfarande stiger, men långsammare än vid nio procent. Fallande inflation är inte samma sak som fallande priser."}, {"q": "Expansiv finanspolitik har tillfälligt sänkt arbetslösheten under jämviktsnivån. Regeringen fortsätter att stimulera efterfrågan för att behålla den låga arbetslösheten. Vilka två följder förutspår monetarismen?", "a": ["Inflationstrycket fortsätter att öka.", "Allt kraftigare stimulanser krävs för att försöka hålla arbetslösheten under jämviktsnivån.", "Jämviktsarbetslösheten sjunker automatiskt.", "Arbetslösheten kan hållas permanent under jämviktsnivån utan högre inflation."], "n": 2, "g": 4, "f": "Rätt svar: Inflationstrycket fortsätter att öka / Allt kraftigare stimulanser krävs för att försöka hålla arbetslösheten under jämviktsnivån. När inflationsförväntningarna anpassas avtar den tillfälliga sysselsättningseffekten. För att fortsätta pressa arbetslösheten under jämviktsnivån krävs enligt monetarismen allt kraftigare stimulanser och stigande inflation."}, {"q": "Ett land har låg inflation, hög konjunkturarbetslöshet och svag efterfrågan. Hur skiljer sig teoriernas huvudsakliga lösningsförslag?", "a": ["Keynesianismen prioriterar expansiv finanspolitik medan monetarismen främst betonar penningpolitiken.", "Keynesianismen förespråkar höjd styrränta medan monetarismen förespråkar offentliga investeringar.", "Keynesianismen förespråkar minskade utgifter medan monetarismen förespråkar höjda skatter.", "Keynesianismen prioriterar avregleringar medan monetarismen förespråkar lånefinansierade investeringar."], "n": 1, "g": 5, "f": "Rätt svar: Keynesianismen prioriterar expansiv finanspolitik medan monetarismen främst betonar penningpolitiken. Keynesianismen betonar statens skatter och utgifter för att stimulera efterfrågan. Monetarismen prioriterar penningpolitiken, exempelvis en lägre styrränta när inflationen är låg."}, {"q": "Ett land har högkonjunktur och stigande efterfrågedriven inflation. Vilka två åtgärder stämmer med keynesianismens respektive monetarismens synsätt?", "a": ["Keynesianism: höja skatterna för att minska efterfrågan.", "Monetarism: höja styrräntan för att minska efterfrågan.", "Monetarism: sänka styrräntan för att öka efterfrågan.", "Keynesianism: höja bidragen för att stimulera konsumtionen."], "n": 2, "g": 5, "f": "Rätt svar: Keynesianism: höja skatterna för att minska efterfrågan / Monetarism: höja styrräntan för att minska efterfrågan. Högre skatter minskar köpkraften genom finanspolitiken. Högre styrränta dämpar konsumtion och investeringar genom penningpolitiken; båda kan minska inflationstrycket."}, {"q": "Regeringen satsar stora summor för att stimulera ekonomin under en lågkonjunktur. Vilken kritik skulle en monetarist kunna rikta mot politiken?", "a": ["Efterfrågestimulanser kan öka inflationen utan att långsiktigt sänka jämviktsarbetslösheten.", "Offentliga investeringar kan aldrig skapa arbetstillfällen.", "Statliga utgifter leder alltid till minskad efterfrågan.", "Expansiv finanspolitik innebär automatiskt minskad penningmängd."], "n": 1, "g": 5, "f": "Rätt svar: Efterfrågestimulanser kan öka inflationen utan att långsiktigt sänka jämviktsarbetslösheten. Stimulanser kan minska konjunkturarbetslösheten tillfälligt, men löser inte automatiskt strukturella problem. Monetarismen varnar också för att inflationen kan stiga."}, {"q": "Ett land har både konjunkturarbetslöshet och strukturarbetslöshet. Vilka två åtgärder riktar sig främst mot respektive problem?", "a": ["Offentliga investeringar för att minska konjunkturarbetslösheten.", "Riktade utbildningsinsatser för att minska strukturarbetslösheten.", "Höjd styrränta för att minska konjunkturarbetslösheten.", "Generella bidragshöjningar för att förbättra utbildningsnivån."], "n": 2, "g": 5, "f": "Rätt svar: Offentliga investeringar för att minska konjunkturarbetslösheten / Riktade utbildningsinsatser för att minska strukturarbetslösheten. Offentliga investeringar ökar efterfrågan och kan skapa jobb under lågkonjunktur. Utbildning riktas i stället mot bristen på rätt kompetens."}, {"q": "Regeringen sänker skatterna för att stimulera ekonomin samtidigt som Riksbanken höjer styrräntan för att bekämpa inflationen. Hur påverkas efterfrågan?", "a": ["Skattesänkningen stimulerar efterfrågan medan räntehöjningen dämpar den.", "Båda åtgärderna syftar till att öka efterfrågan.", "Båda åtgärderna syftar till att minska efterfrågan.", "Skattesänkningen minskar efterfrågan medan räntehöjningen ökar den."], "n": 1, "g": 5, "f": "Rätt svar: Skattesänkningen stimulerar efterfrågan medan räntehöjningen dämpar den. Skattesänkningen ökar hushållens köpkraft medan högre ränta gör lån dyrare. Åtgärderna verkar åt olika håll och nettoeffekten beror på deras styrka."}, {"q": "Två ekonomer diskuterar hur arbetslösheten ska minska. Vilka två resonemang stämmer med keynesianismens respektive monetarismens synsätt?", "a": ["Keynesianism: stimulera efterfrågan när konjunkturarbetslösheten är hög.", "Monetarism: förbättra arbetsmarknadens funktionssätt för att sänka jämviktsarbetslösheten.", "Monetarism: använd återkommande underskott för att permanent hålla arbetslösheten under jämviktsnivån.", "Keynesianism: prioritera alltid budgetbalans framför sysselsättning."], "n": 2, "g": 5, "f": "Rätt svar: Keynesianism: stimulera efterfrågan när konjunkturarbetslösheten är hög / Monetarism: förbättra arbetsmarknadens funktionssätt för att sänka jämviktsarbetslösheten. Keynesianismen betonar efterfrågan när arbetslösheten beror på lågkonjunktur. Monetarismen betonar strukturella åtgärder för att långsiktigt sänka jämviktsarbetslösheten."}, {"q": "Under lågkonjunktur ökar staten investeringarna samtidigt som centralbanken sänker styrräntan. Vilken gemensam konsekvens eftersträvas?", "a": ["Ökad efterfrågan, ökad produktion och minskad konjunkturarbetslöshet.", "Minskad efterfrågan, minskad produktion och lägre inflation.", "Ökad efterfrågan, minskad produktion och högre arbetslöshet.", "Minskad efterfrågan, ökade investeringar och lägre arbetslöshet."], "n": 1, "g": 5, "f": "Rätt svar: Ökad efterfrågan, ökad produktion och minskad konjunkturarbetslöshet. Investeringarna ökar efterfrågan direkt, medan lägre ränta kan stimulera privat konsumtion och investeringar. Båda kan öka produktionen och minska konjunkturarbetslösheten."}, {"q": "Energipriserna stiger kraftigt och landet drabbas av stagflation. Vilka två resonemang visar varför det är svårt att bekämpa både inflationen och arbetslösheten?", "a": ["Expansiv finanspolitik kan minska arbetslösheten men förvärra inflationen.", "Restriktiv penningpolitik kan dämpa inflationen men förvärra lågkonjunkturen.", "Expansiv finanspolitik minskar automatiskt både inflation och arbetslöshet.", "Restriktiv penningpolitik leder automatiskt till lägre arbetslöshet."], "n": 2, "g": 5, "f": "Rätt svar: Expansiv finanspolitik kan minska arbetslösheten men förvärra inflationen / Restriktiv penningpolitik kan dämpa inflationen men förvärra lågkonjunkturen. Expansiv finanspolitik kan stödja sysselsättningen men öka inflationstrycket. Restriktiv penningpolitik kan dämpa inflationen men samtidigt minska efterfrågan och förvärra lågkonjunkturen."}, {"q": "Ett land har hög arbetslöshet trots god försäljning och många lediga tjänster. De arbetslösa saknar ofta rätt utbildning. Varför kan expansiv finanspolitik vara mindre lämplig?", "a": ["Problemet gäller främst arbetskraftens kompetens, inte bristande efterfrågan.", "Expansiv finanspolitik minskar alltid efterfrågan på arbetskraft.", "Expansiv finanspolitik leder alltid till minskad produktion.", "Problemet beror främst på för liten penningmängd."], "n": 1, "g": 5, "f": "Rätt svar: Problemet gäller främst arbetskraftens kompetens, inte bristande efterfrågan. Företagen har redan efterfrågan och lediga jobb, men saknar rätt kompetens. Utbildning och matchning angriper därför problemet mer direkt än generella stimulanser."}, {"q": "Efter en lågkonjunktur har ekonomin återhämtat sig tack vare ekonomiska stimulanser. Arbetslösheten är låg och inflationen börjar stiga. Vilka två åtgärder stämmer med teoriernas respektive rekommendationer?", "a": ["Keynesianism: övergå till restriktiv finanspolitik för att dämpa efterfrågan.", "Monetarism: bedriva restriktiv penningpolitik för att bekämpa inflationen.", "Keynesianism: fortsätta öka offentliga utgifter för att förstärka högkonjunkturen.", "Monetarism: sänka styrräntan för att ytterligare stimulera konsumtionen."], "n": 2, "g": 5, "f": "Rätt svar: Keynesianism: övergå till restriktiv finanspolitik för att dämpa efterfrågan / Monetarism: bedriva restriktiv penningpolitik för att bekämpa inflationen. När efterfrågan blir för stark kan keynesianismen förespråka högre skatter eller lägre utgifter. Monetarismen betonar restriktiv penningpolitik för att dämpa inflationen."}];const panel=document.getElementById('panel');const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let mode='cards',group='Alla',deck=[],idx=0,flip=false,known=new Set(),round=[],selected=-1,locked=false,history=[];function goBack(){if(mode==='cards'||mode==='conceptQuiz')openMode('concepts');else showHome()}function showHome(){document.body.classList.remove("question-mode");document.getElementById('home').hidden=false;document.getElementById('back').hidden=true;panel.hidden=true;window.scrollTo(0,0)}function openMode(m){document.body.classList.remove("question-mode");document.getElementById('home').hidden=true;document.getElementById('back').hidden=false;panel.hidden=false;window.scrollTo(0,0);mode=m;document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['cards','theory','quiz'][i]===m));document.getElementById('back').textContent=(m==='cards'||m==='conceptQuiz')?'← Tillbaka till begrepp':'← Tillbaka till övningarna';if(m==='concepts')renderConcepts();else if(m==='cards')resetCards();else if(m==='compare')cmpStart();else startRound()}

function resetCards(){deck=cards.filter(c=>group==='Alla'||c.g===group);idx=0;flip=false;renderCards()}
function renderCards(){let c=deck[idx];panel.innerHTML=`<h2>Begrepp</h2><div class="row"><select id="filter" aria-label="Kategori">${['Alla','Gemensamma','Keynesianism','Monetarism'].map(g=>`<option ${g===group?'selected':''}>${g}</option>`).join('')}</select><button onclick="deck=shuffle(deck);idx=0;flip=false;renderCards()">Blanda kort</button></div><p><small>Kort ${idx+1} av ${deck.length} · Kan ${deck.filter(c=>known.has(c.t)).length} av ${deck.length}</small></p><button class="flash ${c.g==='Keynesianism'?'k':c.g==='Monetarism'?'m':''}" onclick="flip=!flip;renderCards()"><small>${c.g}</small><strong>${flip?c.d:c.t}</strong><small>Tryck för att vända</small></button><div class="row"><button onclick="move(-1)">← Föregående</button><button onclick="move(1)">Nästa →</button></div><div class="row" style="margin-top:8px"><button onclick="known.delete(deck[idx].t);move(1)">Öva mer</button><button class="primary" onclick="known.add(deck[idx].t);move(1)">Kan begreppet ✓</button></div><details><summary>Visa begreppslista</summary>${deck.map(c=>`<p><b>${c.t}</b><br>${c.d}</p>`).join('')}</details>`;document.getElementById('filter').onchange=e=>{group=e.target.value;resetCards()}}
function move(n){idx=(idx+n+deck.length)%deck.length;flip=false;renderCards()}
function startRound(){if(mode==='quiz'){startMainQuiz();return;}round=(mode==='conceptQuiz'?shuffle(cards).slice(0,20).map(c=>({q:c.d,a:[c.t,...shuffle(cards.filter(x=>x.t!==c.t)).slice(0,3).map(x=>x.t)],f:'Rätt begrepp: '+c.t+'.'})):(mode==='theory'?shuffle([...shuffle(theory.filter(q=>q.a[0]==='Keynesianism')).slice(0,10),...shuffle(theory.filter(q=>q.a[0]==='Monetarism')).slice(0,10)]):shuffle(quiz).slice(0,20))).map(q=>({...q,opts:shuffle(q.a)}));idx=0;selected=-1;locked=false;history=[];renderQuestion();window.scrollTo(0,0)}
function renderQuestion(){document.body.classList.add("question-mode");let q=round[idx];panel.innerHTML=`<div class="question-meta"><span>Fråga ${idx+1} av ${round.length}</span><span class="score-pill">Antal rätt: ${history.filter(h=>h.chosen===h.right).length} av ${history.length}</span></div><h2>${mode==='conceptQuiz'?'Begreppsquiz':mode==='theory'?'Vilken teori?':'Quiz'}</h2><small>${mode==='conceptQuiz'?'Vilket begrepp passar definitionen? · 20 av 48 slumpas fram':mode==='theory'?'Välj den teori som påståendet främst förknippas med. · 20 av 50 (10 per teori)':'Välj det alternativ som passar bäst.'}</small><div class="progress"><div style="width:${100*idx/round.length}%"></div></div><div id="question">${q.q}</div><div class="options simple-options ${mode==='theory'?'theory-options':''}">${q.opts.map((a,i)=>`<button class="${locked?(a===q.a[0]?'correct':i===selected?'wrong':''):i===selected?'selected':''}" ${locked?'disabled':''} onclick="chooseAnswer(${i})">${a}</button>`).join('')}</div><div class="actions simple-actions" ${!locked&&mode!=='quiz'?'hidden':''}><button class="primary" ${selected<0?'disabled':''} onclick="${locked?'next()':'check()'}">${locked?(idx===round.length-1?'Visa resultat':'Nästa fråga →'):'Rätta svar'}</button></div>${locked?`<div class="feedback ${q.opts[selected]===q.a[0]?'correct':'wrong'}"><b>${q.opts[selected]===q.a[0]?'Rätt!':'Inte riktigt.'}</b> ${q.f}</div>`:''}`}
function revealFeedback(){const f=panel.querySelector('.feedback');if(!f)return;const a=panel.querySelector('.actions');const bottom=a&&!a.hidden?a.getBoundingClientRect().top:window.innerHeight;const r=f.getBoundingClientRect();if(r.bottom>bottom-8)window.scrollBy(0,r.bottom-bottom+12)}
function chooseAnswer(i){if(locked)return;selected=i;if(mode==='theory'||mode==='conceptQuiz')check();else renderQuestion()}
function check(){if(locked||selected<0)return;locked=true;let q=round[idx];history.push({q:q.q,chosen:q.opts[selected],right:q.a[0],f:q.f});renderQuestion()}
function next(){if(!locked)return;idx++;selected=-1;locked=false;if(idx<round.length){renderQuestion();window.scrollTo(0,0)}else{document.body.classList.remove("question-mode");window.scrollTo(0,0);let score=history.filter(h=>h.chosen===h.right).length;panel.innerHTML=`<h2>Resultat: ${score} av ${round.length}</h2><button class="primary" onclick="startRound()">Ny omgång</button><h3>Genomgång</h3>${history.map(h=>`<details><summary>${h.chosen===h.right?'✓':'×'} ${h.q}</summary><p>Ditt svar: ${h.chosen}<br>Rätt svar: ${h.right}<br>${h.f}</p></details>`).join('')}`}}
let multi=[];
function startMainQuiz(){const pick=(g,n)=>shuffle(quiz.filter(q=>q.g===g)).slice(0,n);round=[...pick(0,2),...shuffle([...pick(1,2),...pick(3,2)]),...shuffle([...pick(2,3),...pick(4,3)]),...pick(5,3)].map(q=>({...q,opts:shuffle(q.a)}));idx=0;multi=[];locked=false;history=[];renderMainQuiz();window.scrollTo(0,0)}
function mainCorrect(q){return multi.length===q.n&&multi.every(i=>q.a.slice(0,q.n).includes(q.opts[i]))}
function renderMainQuiz(){document.body.classList.add("question-mode");let q=round[idx],ok=mainCorrect(q);panel.innerHTML=`<div class="question-meta"><span>Fråga ${idx+1} av ${round.length}</span><span class="score-pill">Antal rätt: ${history.filter(h=>h.ok).length} av ${history.length}</span></div><small class="question-label">Quiz · 15 av 60 · ${idx<2?'Begrepp':idx<6?'Lösningsförslag':idx<12?'Konsekvenser':'Jämförelse och analys'}</small><div class="progress"><div style="width:${100*(idx+(locked?1:0))/round.length}%"></div></div><div id="question">${q.q}</div><p><b>Välj ${q.n===1?'ett alternativ':'två alternativ'} (${multi.length}/${q.n})</b></p><div class="options">${q.opts.map((a,i)=>`<button aria-pressed="${multi.includes(i)}" class="${locked?(q.a.slice(0,q.n).includes(a)?'correct':multi.includes(i)?'wrong':''):multi.includes(i)?'selected':''}" ${locked?'disabled':''} onclick="chooseMain(${i})"><span aria-hidden="true" class="choice-mark ${q.n===2?'square':''} ${multi.includes(i)?'chosen':''}"></span><span class="choice-text">${String.fromCharCode(65+i)}. ${a}</span></button>`).join('')}</div><div class="actions quiz-actions"><button class="primary" ${!locked&&multi.length!==q.n?'disabled':''} onclick="${locked?'nextMain()':'checkMain()'}">${locked?(idx===round.length-1?'Visa resultat':'Nästa fråga →'):'Rätta svar'}</button></div>${locked?`<div class="feedback ${ok?'correct':'wrong'}"><b>${ok?'Rätt!':'Inte riktigt.'}</b> ${q.f}</div>`:''}`}
function chooseMain(i){if(locked)return;if(multi.includes(i))multi=multi.filter(x=>x!==i);else if(round[idx].n===1)multi=[i];else if(multi.length<round[idx].n)multi.push(i);renderMainQuiz()}
function checkMain(){let q=round[idx];if(locked||multi.length!==q.n)return;const ok=mainCorrect(q);history.push({q:q.q,chosen:multi.map(i=>q.opts[i]).join(' · '),right:q.a.slice(0,q.n).join(' · '),f:q.f,ok});locked=true;panel.querySelectorAll('.options button').forEach((button,i)=>{button.className=q.a.slice(0,q.n).includes(q.opts[i])?'correct':multi.includes(i)?'wrong':'';button.disabled=true});const button=panel.querySelector('.quiz-actions button');button.textContent=idx===round.length-1?'Visa resultat':'Nästa fråga →';button.setAttribute('onclick','nextMain()');panel.querySelector('.progress div').style.width=100*(idx+1)/round.length+'%';panel.querySelector('.score-pill').textContent='Antal rätt: '+history.filter(h=>h.ok).length+' av '+history.length;const feedback=document.createElement('div');feedback.className='feedback '+(ok?'correct':'wrong');feedback.innerHTML='<b>'+(ok?'Rätt!':'Inte riktigt.')+'</b> '+q.f;panel.appendChild(feedback)}
function nextMain(){if(!locked)return;idx++;multi=[];locked=false;if(idx<round.length){renderMainQuiz();window.scrollTo(0,0)}else{document.body.classList.remove("question-mode");window.scrollTo(0,0);panel.innerHTML=`<h2>Resultat: ${history.filter(h=>h.ok).length} av ${round.length}</h2><button class="primary" onclick="startRound()">Ny omgång</button><h3>Genomgång</h3>${history.map(h=>`<details><summary>${h.ok?'✓':'×'} ${h.q}</summary><p>Ditt svar: ${h.chosen}<br>Rätt svar: ${h.right}<br>${h.f}</p></details>`).join('')}`}}
